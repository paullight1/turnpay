# =============================================================================
# TRUSTPAY — DigitalOcean App Platform Configuration
# =============================================================================
# Legacy alternative deployment definition. TRUSTPAY V1 uses Render + Vercel.
# If this file is ever used, PostgreSQL must still be the Supabase production
# project; this definition must never provision or reference a DO database.
#
# Deploy:  doctl apps create --spec BACKEND/do-app.yaml
# Update:  doctl apps update YOUR_APP_ID --spec BACKEND/do-app.yaml
# =============================================================================

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
  - rule: HEALTH_CHECK_FAILED

# ─── Services ───────────────────────────────────────────────────────────────
services:
  # Backend API (NestJS)
  - name: trustpay-backend
    environment_slug: node-js
    instance_count: 1                # Set to 2 for HA
    instance_size_slug: basic-xxs    # 512MB / 1 vCPU — upgrade for production

    git:
      branch: main
      repo_clone_url: https://github.com/your-org/trustpay.git

    source_dir: BACKEND
    dockerfile_path: Dockerfile
    http_port: 3000

    health_check:
      http_path: /api/health/ready
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      healthy_threshold: 2
      unhealthy_threshold: 5

    envs:
      # Application
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "3000"
        scope: RUN_TIME
      - key: REDIS_ALLOW_MEMORY_FALLBACK
        value: "false"
        scope: RUN_TIME
      - key: TRUST_PROXY_HOPS
        value: "1"
        scope: RUN_TIME

      # Database (Supabase session pooler, port 5432, TLS required)
      - key: DATABASE_URL
        value: REPLACE_WITH_SUPABASE_SESSION_POOLER_URL
        scope: RUN_TIME
        type: SECRET

      # Redis (references managed DO Redis)
      - key: REDIS_HOST
        value: ${trustpay-redis.HOSTNAME}
        scope: RUN_TIME
      - key: REDIS_PORT
        value: ${trustpay-redis.PORT}
        scope: RUN_TIME
      - key: REDIS_PASSWORD
        value: ${trustpay-redis.PASSWORD}
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        value: rediss://default:${trustpay-redis.PASSWORD}@${trustpay-redis.HOSTNAME}:${trustpay-redis.PORT}
        scope: RUN_TIME
        type: SECRET

      # Supabase
      - key: SUPABASE_URL
        value: https://your-project.supabase.co
        scope: RUN_TIME
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_your_key
        scope: RUN_TIME
      - key: SUPABASE_ANON_KEY
        value: sb_anon_your_key
        scope: RUN_TIME
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: sb_service_role_your_key
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_JWT_SECRET
        value: your-jwt-secret
        scope: RUN_TIME
        type: SECRET

      # JWT
      - key: JWT_SECRET
        value: GENERATE_AND_REPLACE
        scope: RUN_TIME
        type: SECRET
      - key: JWT_REFRESH_SECRET
        value: GENERATE_AND_REPLACE
        scope: RUN_TIME
        type: SECRET

      # Banking
      - key: BANKING_ENABLED
        value: "true"
        scope: RUN_TIME
      - key: VIRTUAL_ACCOUNTS_ENABLED
        value: "true"
        scope: RUN_TIME
      - key: BANKING_SANDBOX_MODE
        value: "false"
        scope: RUN_TIME
      - key: BANKING_PROVIDER_PRIMARY
        value: monnify
        scope: RUN_TIME

      # Monnify
      - key: MONNIFY_API_KEY
        value: MK_PROD_REPLACE
        scope: RUN_TIME
        type: SECRET
      - key: MONNIFY_SECRET_KEY
        value: REPLACE
        scope: RUN_TIME
        type: SECRET
      - key: MONNIFY_CONTRACT_CODE
        value: REPLACE
        scope: RUN_TIME
        type: SECRET
      - key: MONNIFY_BASE_URL
        value: https://api.monnify.com
        scope: RUN_TIME
      - key: MONNIFY_WEBHOOK_URL
        value: https://api.trustpay.com/api/webhooks/monnify
        scope: RUN_TIME

      # Encryption
      - key: PII_ENCRYPTION_KEY
        value: GENERATE_WITH_OPENSSL_RAND_HEX_32
        scope: RUN_TIME
        type: SECRET
      - key: BANK_ACCOUNT_ENCRYPTION_KEY
        value: GENERATE_WITH_OPENSSL_RAND_HEX_32
        scope: RUN_TIME
        type: SECRET
      - key: IDEMPOTENCY_RESPONSE_ENCRYPTION_KEY
        value: REPLACE_WITH_32_RANDOM_BYTES_BASE64
        scope: RUN_TIME
        type: SECRET
      - key: IDEMPOTENCY_RESPONSE_ENCRYPTION_KEY_ID
        value: v1
        scope: RUN_TIME

      # VTU
      - key: VTU_PROVIDER
        value: vtpass
        scope: RUN_TIME
      - key: VTU_ENABLED
        value: "true"
        scope: RUN_TIME
      - key: VTU_SIMULATION_ENABLED
        value: "false"
        scope: RUN_TIME
      - key: VTPASS_BASE_URL
        value: https://vtpass.com/api
        scope: RUN_TIME
      - key: VTPASS_LOW_BALANCE_THRESHOLD
        value: "5000"
        scope: RUN_TIME
      - key: VTPASS_API_KEY
        value: REPLACE
        scope: RUN_TIME
        type: SECRET
      - key: VTPASS_PUBLIC_KEY
        value: PK_REPLACE
        scope: RUN_TIME
        type: SECRET
      - key: VTPASS_SECRET_KEY
        value: SK_REPLACE
        scope: RUN_TIME
        type: SECRET
      - key: VTPASS_WEBHOOK_SECRET
        value: REPLACE
        scope: RUN_TIME
        type: SECRET

      # KYC
      - key: KYC_PROVIDER
        value: ninja
        scope: RUN_TIME
      - key: NINJA_BASE_URL
        value: https://api.ninja.boucloud.io
        scope: RUN_TIME
      - key: NINJA_CLIENT_KEY
        value: REPLACE
        scope: RUN_TIME
        type: SECRET
      - key: NINJA_CLIENT_SECRET
        value: REPLACE
        scope: RUN_TIME
        type: SECRET

      # URLs
      - key: WEB_URL
        value: ${APP_URL}
        scope: RUN_TIME
      - key: ADMIN_URL
        value: ${APP_URL}/admin
        scope: RUN_TIME

      # Feature Flags
      - key: TRANSACTION_PIN_REQUIRED
        value: "true"
        scope: RUN_TIME
      - key: ENABLE_SWAGGER
        value: "false"
        scope: RUN_TIME

  # Website (Next.js Frontend)
  - name: trustpay-website
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs

    git:
      branch: main
      repo_clone_url: https://github.com/your-org/trustpay.git

    source_dir: WEBSITE
    dockerfile_path: Dockerfile
    http_port: 3001

    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      healthy_threshold: 2
      unhealthy_threshold: 5

    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: NEXT_PUBLIC_API_URL
        value: ${trustpay-backend.APP_URL}
        scope: RUN_TIME
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://your-project.supabase.co
        scope: RUN_TIME
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_your_key
        scope: RUN_TIME

# ─── Region ─────────────────────────────────────────────────────────────────
region: lag

