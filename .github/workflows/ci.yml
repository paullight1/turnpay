name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustpay
          POSTGRES_PASSWORD: trustpay_secret
          POSTGRES_DB: trustpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: BACKEND/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://trustpay:trustpay_secret@localhost:5432/trustpay_test?schema=public

      - name: Deploy database migrations
        run: npm run db:deploy
        env:
          DATABASE_URL: postgresql://trustpay:trustpay_secret@localhost:5432/trustpay_test?schema=public

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://trustpay:trustpay_secret@localhost:5432/trustpay_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci
          JWT_REFRESH_EXPIRES_IN: 7d
          WEB_URL: http://localhost:3001
          ADMIN_URL: http://localhost:3002

      - name: Run backend e2e tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://trustpay:trustpay_secret@localhost:5432/trustpay_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci
          JWT_REFRESH_EXPIRES_IN: 7d
          WEB_URL: http://localhost:3001
          ADMIN_URL: http://localhost:3002

      - name: Build
        run: npm run build

  website-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WEBSITE

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: WEBSITE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright e2e tests
        run: npm run test:e2e
        env:
          PORT: 3001
          NEXT_PUBLIC_API_URL: http://localhost:3000

  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  docker:
    needs: [backend-test, website-test, flutter-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./BACKEND
          push: true
          tags: trustpay/backend:latest,trustpay/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push website
        uses: docker/build-push-action@v5
        with:
          context: ./WEBSITE
          push: true
          tags: trustpay/website:latest,trustpay/website:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
