name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  manifest-safety:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check production manifests for unsafe defaults
        run: |
          ./scripts/check-production-manifests.sh
          sh ./scripts/check-production-manifests.test.sh

      - name: Check repository for committed secrets
        run: ./scripts/check-secrets.sh

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustpay
          POSTGRES_PASSWORD: trustpay_secret
          POSTGRES_DB: trustpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: BACKEND/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://trustpay:trustpay_secret@localhost:5432/trustpay_test?schema=public

      - name: Create Prisma shadow database
        run: PGPASSWORD=trustpay_secret psql -h localhost -U trustpay -d postgres -c "CREATE DATABASE trustpay_shadow"

      - name: Validate Prisma schema and migration drift
        run: ./scripts/check-migration-drift.sh
        env:
          DATABASE_URL: postgresql://trustpay:trustpay_secret@localhost:5432/trustpay_test?schema=public
          SHADOW_DATABASE_URL: postgresql://trustpay:trustpay_secret@localhost:5432/trustpay_shadow?schema=public

      - name: Deploy database migrations
        run: npm run db:deploy
        env:
          DATABASE_URL: postgresql://trustpay:trustpay_secret@localhost:5432/trustpay_test?schema=public

      - name: Create and migrate isolated financial test database
        run: PGPASSWORD=trustpay_secret psql -h localhost -U trustpay -d postgres -c "CREATE DATABASE trustpay_financial_test_ci"

      - name: Deploy migrations to isolated financial test database
        run: npm run db:deploy
        env:
          DATABASE_URL: postgresql://trustpay:trustpay_secret@localhost:5432/trustpay_financial_test_ci?schema=public

      - name: Create disposable restore-drill database
        run: PGPASSWORD=trustpay_secret psql -h localhost -U trustpay -d postgres -c "CREATE DATABASE trustpay_restore"

      - name: Verify database backup restore
        run: ./scripts/verify-backup-restore.sh
        env:
          DATABASE_URL: postgresql://trustpay:trustpay_secret@localhost:5432/trustpay_test?schema=public
          RESTORE_DATABASE_URL: postgresql://trustpay:trustpay_secret@localhost:5432/trustpay_restore?schema=public

      - name: Validate production config guard
        run: ./scripts/validate-production-config.sh true
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres.project-ref:test-password@aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require&schema=public
          WEB_URL: https://trustpay.example.com
          ADMIN_URL: https://admin.trustpay.example.com
          JWT_SECRET: test-jwt-secret-at-least-32-characters
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-characters
          REDIS_URL: rediss://default:test@redis.example.com:6379
          REDIS_ALLOW_MEMORY_FALLBACK: "false"
          TRUST_PROXY_HOPS: "1"
          IDEMPOTENCY_RESPONSE_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
          IDEMPOTENCY_RESPONSE_ENCRYPTION_KEY_ID: v1
          TRANSACTION_PIN_REQUIRED: "true"
          BANKING_ENABLED: "true"
          VIRTUAL_ACCOUNTS_ENABLED: "true"
          WITHDRAWALS_ENABLED: "true"
          INTERNAL_TRANSFERS_ENABLED: "false"
          MONNIFY_API_KEY: monnify-api-key
          MONNIFY_SECRET_KEY: monnify-secret-key
          MONNIFY_CONTRACT_CODE: contract-code
          MONNIFY_BASE_URL: https://monnify-live.example.com
          MONNIFY_WEBHOOK_URL: https://api.trustpay.example.com/api/webhooks/monnify
          MONNIFY_EXCHANGE_COLLECTION_ACCOUNT_NUMBER: 1234567890
          KYC_PROVIDER: ninja
          NINJA_CLIENT_KEY: test-ninja-client-key
          NINJA_CLIENT_SECRET: test-ninja-client-secret
          NINJA_BASE_URL: https://api.ninja.boucloud.io
          PII_ENCRYPTION_KEY: test-pii-key-with-at-least-32-characters
          VTU_ENABLED: "true"
          VTU_SIMULATION_ENABLED: "false"
          VTU_PROVIDER: vtpass
          VTPASS_BASE_URL: https://vtpass.com/api
          VTPASS_API_KEY: vtpass-api-key
          VTPASS_PUBLIC_KEY: vtpass-public-key
          VTPASS_SECRET_KEY: vtpass-secret-key
          VTPASS_WEBHOOK_SECRET: vtpass-webhook-secret

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://trustpay:trustpay_secret@localhost:5432/trustpay_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci
          JWT_REFRESH_EXPIRES_IN: 7d
          MONNIFY_EXCHANGE_COLLECTION_ACCOUNT_NUMBER: "0000000000"
          WEB_URL: http://localhost:3001
          ADMIN_URL: http://localhost:3002

      - name: Run backend e2e tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://trustpay:trustpay_secret@localhost:5432/trustpay_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci
          JWT_REFRESH_EXPIRES_IN: 7d
          MONNIFY_EXCHANGE_COLLECTION_ACCOUNT_NUMBER: "0000000000"
          WEB_URL: http://localhost:3001
          ADMIN_URL: http://localhost:3002

      - name: Run financial and fault-injection E2E tests
        run: npm run test:financial:e2e
        env:
          FINANCIAL_TEST_DATABASE_URL: postgresql://trustpay:trustpay_secret@localhost:5432/trustpay_financial_test_ci?schema=public
          FINANCIAL_TEST_REDIS_URL: redis://localhost:6379
          NODE_ENV: staging
          REDIS_ALLOW_MEMORY_FALLBACK: "false"
          TRANSACTION_PIN_REQUIRED: "true"

      - name: Build
        run: npm run build

  backend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: BACKEND/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  website-test:
    runs-on: ubuntu-latest
    env:
      # Third-party chat is not part of application E2E coverage and can place
      # a remote iframe over controls while WebKit tests are running.
      NEXT_PUBLIC_TAWK_ENABLED: "false"
    defaults:
      run:
        working-directory: WEBSITE

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: WEBSITE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3100

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright e2e tests
        run: npm run test:e2e
        env:
          PORT: 3001
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3100

  website-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WEBSITE

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: WEBSITE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Flutter web release
        run: flutter build web --release

      - name: Run internal transfer integration certification
        run: flutter test test/internal_transfer_flow_integration_test.dart

  docker:
    needs:
      [
        manifest-safety,
        backend-test,
        backend-security,
        website-test,
        website-security,
        flutter-test,
      ]
    runs-on: ubuntu-latest
    # Render and Vercel deploy directly from Git. Docker Hub publishing is an
    # optional release channel and must be explicitly enabled after its
    # credentials are configured.
    if: github.ref == 'refs/heads/main' && vars.DOCKER_PUBLISH_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./BACKEND
          push: true
          tags: trustpay/backend:latest,trustpay/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push website
        uses: docker/build-push-action@v5
        with:
          context: ./WEBSITE
          push: true
          tags: trustpay/website:latest,trustpay/website:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
