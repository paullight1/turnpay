services:
  - type: web
    name: trustpay-backend
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    domains:
      - api.trustpayhq.com
    dockerfilePath: ./BACKEND/Dockerfile
    dockerContext: ./BACKEND
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: "staging"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true" # Free services do not support pre-deploy commands.
      - key: WEB_URL
        value: "https://www.trustpayhq.com"
      - key: ADMIN_URL
        value: "https://www.trustpayhq.com"
      - key: SENTRY_DSN
        value: "" # Optional: set a real DSN to enable Sentry.
      - key: OTP_EXPIRES_IN
        value: "5m"
      - key: OTP_LENGTH
        value: "6"
      - key: OTP_DEV_CODE
        value: ""
      - key: OTP_PROVIDER
        value: "supabase_email"
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: "info"
      - key: DATABASE_URL
        sync: false # Supabase session pooler URL (port 5432) with sslmode=require
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trustpay-redis
          property: connectionString
      - key: REDIS_ALLOW_MEMORY_FALLBACK
        value: "false"
      - key: TRUST_PROXY_HOPS
        # Fallback for non-Render production runs; Render is detected via its
        # platform-provided RENDER variable and trusts its normalized chain.
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: IDEMPOTENCY_RESPONSE_ENCRYPTION_KEY
        sync: false # Exactly 32 random bytes encoded as base64
      - key: IDEMPOTENCY_RESPONSE_ENCRYPTION_KEY_ID
        value: "v1"
      - key: BANK_ACCOUNT_ENCRYPTION_KEY
        generateValue: true
      - key: PII_KEY_VERSION
        value: "1"
      - key: TRANSACTION_PIN_REQUIRED
        value: "true"
      - key: INTERNAL_TRANSFERS_ENABLED
        value: "false"
      - key: BANKING_ENABLED
        value: "true"
      - key: VIRTUAL_ACCOUNTS_ENABLED
        value: "true"
      - key: WITHDRAWALS_ENABLED
        value: "false"
      - key: BANKING_SANDBOX_MODE
        value: "true"
      - key: KYC_PROVIDER
        value: "paystack"
      - key: NINJA_NIN_ENABLED
        value: "true"
      - key: NINJA_BASE_URL
        value: "https://api.ninja.boucloud.io"
      - key: NINJA_SECRET_KEY
        sync: false # Server-only Ninja live secret; never put its value in this file.
      - key: KYC_DOCUMENT_BUCKET
        value: "kyc-documents"
      - key: EXCHANGE_RECEIPT_BUCKET
        value: "exchange-receipts"
      - key: VTU_PROVIDER
        value: "vtpass"
      - key: VTU_ENABLED
        value: "true"
      - key: VTU_SIMULATION_ENABLED
        value: "false"
      - key: VTPASS_BASE_URL
        # Staging may exercise the provider contract, but it must never reach
        # the live VTpass wallet or create a billable purchase.
        value: "https://sandbox.vtpass.com/api"
      - key: VTPASS_LOW_BALANCE_THRESHOLD
        value: "5000"
      - key: VTPASS_API_KEY
        sync: false
      - key: VTPASS_PUBLIC_KEY
        sync: false
      - key: VTPASS_SECRET_KEY
        sync: false
      - key: VTPASS_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BANKING_PROVIDER_PRIMARY
        value: "paystack"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CHECKOUT_ENABLED
        value: "true"

  - type: keyvalue
    name: trustpay-redis
    plan: free
    region: frankfurt
    # Idempotency, lockout, and OTP keys must never be silently evicted.
    maxmemoryPolicy: noeviction
    ipAllowList: []
