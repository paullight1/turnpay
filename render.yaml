services:
  - type: web
    name: trustpay-backend
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    domains:
      - api.trustpayhq.com
    dockerfilePath: ./BACKEND/Dockerfile
    dockerContext: ./BACKEND
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: "staging"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true" # Free services do not support pre-deploy commands.
      - key: WEB_URL
        value: "https://www.trustpayhq.com"
      - key: ADMIN_URL
        value: "https://www.trustpayhq.com"
      - key: SENTRY_DSN
        sync: false # TODO(launch): set Sentry DSN for error monitoring
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: "info"
      - key: DATABASE_URL
        sync: false # Supabase session pooler URL (port 5432) with sslmode=require
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trustpay-redis
          property: connectionString
      - key: REDIS_ALLOW_MEMORY_FALLBACK
        value: "false"
      - key: TRUST_PROXY_HOPS
        # Fallback for non-Render production runs; Render is detected via its
        # platform-provided RENDER variable and trusts its normalized chain.
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: IDEMPOTENCY_RESPONSE_ENCRYPTION_KEY
        sync: false # Exactly 32 random bytes encoded as base64
      - key: IDEMPOTENCY_RESPONSE_ENCRYPTION_KEY_ID
        value: "v1"
      - key: BANK_ACCOUNT_ENCRYPTION_KEY
        generateValue: true
      - key: PII_KEY_VERSION
        value: "1"
      - key: TRANSACTION_PIN_REQUIRED
        value: "true"
      - key: INTERNAL_TRANSFERS_ENABLED
        value: "false"
      - key: BANKING_ENABLED
        value: "true"
      - key: VIRTUAL_ACCOUNTS_ENABLED
        value: "true"
      - key: WITHDRAWALS_ENABLED
        value: "false"
      - key: BANKING_SANDBOX_MODE
        value: "true"
      - key: KYC_PROVIDER
        value: "ninja"
      - key: KYC_DOCUMENT_BUCKET
        value: "kyc-documents"
      - key: NINJA_CLIENT_KEY
        sync: false
      - key: NINJA_CLIENT_SECRET
        sync: false
      - key: NINJA_BASE_URL
        value: "https://api.sandbox.ninja.boucloud.io"
      - key: EXCHANGE_RECEIPT_BUCKET
        value: "exchange-receipts"
      - key: VTU_PROVIDER
        value: "vtpass"
      - key: VTU_ENABLED
        value: "true"
      - key: VTU_SIMULATION_ENABLED
        value: "false"
      - key: VTPASS_BASE_URL
        value: "https://vtpass.com/api"
      - key: VTPASS_LOW_BALANCE_THRESHOLD
        value: "5000"
      - key: VTPASS_API_KEY
        sync: false
      - key: VTPASS_PUBLIC_KEY
        sync: false
      - key: VTPASS_SECRET_KEY
        sync: false
      - key: VTPASS_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false
      - key: MONNIFY_BASE_URL
        value: "https://sandbox.monnify.com"
      - key: MONNIFY_WEBHOOK_URL
        value: "https://api.trustpayhq.com/api/webhooks/monnify"
      - key: MONNIFY_GET_ALL_AVAILABLE_BANKS
        value: "true"
      - key: MONNIFY_RESTRICT_PAYMENT_SOURCE
        value: "false"
      - key: MONNIFY_TEST_BVN
        sync: false
      - key: MONNIFY_TEST_NIN
        sync: false

  - type: keyvalue
    name: trustpay-redis
    plan: free
    region: frankfurt
    # Idempotency, lockout, and OTP keys must never be silently evicted.
    maxmemoryPolicy: noeviction
    ipAllowList: []
