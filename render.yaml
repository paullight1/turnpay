services:
  - type: web
    name: trustpay-backend
    runtime: docker
    plan: free # TODO(launch): move to paid plan with backups
    region: oregon
    branch: main
    autoDeploy: true
    dockerfilePath: ./BACKEND/Dockerfile
    dockerContext: ./BACKEND
    preDeployCommand: npx prisma migrate deploy
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: WEB_URL
        value: "https://trustpay.xyz" # TODO(launch): set real origin
      - key: ADMIN_URL
        value: "https://admin.trustpay.xyz" # TODO(launch): set real origin
      - key: SENTRY_DSN
        sync: false # TODO(launch): set Sentry DSN for error monitoring
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: "info"
      - key: DATABASE_URL
        fromDatabase:
          name: trustpay-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trustpay-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: BANK_ACCOUNT_ENCRYPTION_KEY
        generateValue: true
      - key: PII_KEY_VERSION
        value: "1"
      - key: TRANSACTION_PIN_REQUIRED
        value: "true"
      - key: BANKING_ENABLED
        value: "true"
      - key: VIRTUAL_ACCOUNTS_ENABLED
        value: "true"
      - key: WITHDRAWALS_ENABLED
        value: "true"
      - key: BANKING_SANDBOX_MODE
        value: "false"
      - key: KYC_PROVIDER
        value: "manual"
      - key: KYC_DOCUMENT_BUCKET
        value: "kyc-documents"
      - key: EXCHANGE_RECEIPT_BUCKET
        value: "exchange-receipts"
      - key: VTU_PROVIDER
        value: "vtpass"
      - key: VTPASS_BASE_URL
        sync: false # Operator gate: set the live VTpass base URL before enabling production traffic
      - key: VTPASS_LOW_BALANCE_THRESHOLD
        value: "5000"
      - key: VTPASS_API_KEY
        sync: false
      - key: VTPASS_PUBLIC_KEY
        sync: false
      - key: VTPASS_SECRET_KEY
        sync: false
      - key: VTPASS_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false
      - key: MONNIFY_BASE_URL
        sync: false # Operator gate: set the live Monnify base URL before enabling production traffic
      - key: MONNIFY_WEBHOOK_SECRET
        sync: false
      - key: MONNIFY_WEBHOOK_URL
        sync: false # Operator gate: set the canonical HTTPS callback URL for this deployment
      - key: MONNIFY_GET_ALL_AVAILABLE_BANKS
        value: "true"
      - key: MONNIFY_RESTRICT_PAYMENT_SOURCE
        value: "false"
      - key: MONNIFY_TEST_BVN
        sync: false
      - key: MONNIFY_TEST_NIN
        sync: false

  - type: keyvalue
    name: trustpay-redis
    plan: free # TODO(launch): move to paid plan with backups
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: trustpay-postgres
    databaseName: trustpay
    user: trustpay
    plan: free # TODO(launch): move to paid plan with backups
    postgresMajorVersion: "15"
    ipAllowList: []
