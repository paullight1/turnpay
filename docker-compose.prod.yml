services:
  redis:
    image: redis:7-alpine
    container_name: trustpay-redis
    restart: unless-stopped
    expose:
      - '6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustpay

  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: trustpay-backend
    restart: unless-stopped
    ports:
      # Keep the application origin private to this host. A TLS reverse proxy
      # (Nginx, Caddy, or the platform ingress) is the only public boundary.
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      SENTRY_DSN: ${SENTRY_DSN:?SENTRY_DSN is required}
      OTP_EXPIRES_IN: ${OTP_EXPIRES_IN:-5m}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      OTP_DEV_CODE: ${OTP_DEV_CODE:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?TWILIO_ACCOUNT_SID is required}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?TWILIO_AUTH_TOKEN is required}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:?TWILIO_PHONE_NUMBER is required}
      DATABASE_URL: ${DATABASE_URL:?Supabase DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required and must address the redis service}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_ALLOW_MEMORY_FALLBACK: "false"
      TRUST_PROXY_HOPS: "1"
      WEB_URL: ${WEB_URL}
      ADMIN_URL: ${ADMIN_URL}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      KYC_PROVIDER: paystack
      BANKING_PROVIDER_PRIMARY: paystack
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_CHECKOUT_ENABLED: "true"
      MONNIFY_API_KEY: ${MONNIFY_API_KEY:-}
      MONNIFY_SECRET_KEY: ${MONNIFY_SECRET_KEY:-}
      MONNIFY_CONTRACT_CODE: ${MONNIFY_CONTRACT_CODE:-}
      MONNIFY_BASE_URL: ${MONNIFY_BASE_URL:-}
      MONNIFY_WEBHOOK_URL: ${MONNIFY_WEBHOOK_URL:-}
      MONNIFY_EXCHANGE_COLLECTION_ACCOUNT_NUMBER: ${MONNIFY_EXCHANGE_COLLECTION_ACCOUNT_NUMBER:-}
      VTU_PROVIDER: vtpass
      VTU_ENABLED: ${VTU_ENABLED:-true}
      VTU_SIMULATION_ENABLED: "false"
      VTPASS_BASE_URL: ${VTPASS_BASE_URL:-https://vtpass.com/api}
      VTPASS_LOW_BALANCE_THRESHOLD: ${VTPASS_LOW_BALANCE_THRESHOLD:-5000}
      VTPASS_API_KEY: ${VTPASS_API_KEY}
      VTPASS_PUBLIC_KEY: ${VTPASS_PUBLIC_KEY}
      VTPASS_SECRET_KEY: ${VTPASS_SECRET_KEY}
      VTPASS_WEBHOOK_SECRET: ${VTPASS_WEBHOOK_SECRET}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      IDEMPOTENCY_RESPONSE_ENCRYPTION_KEY: ${IDEMPOTENCY_RESPONSE_ENCRYPTION_KEY:?IDEMPOTENCY_RESPONSE_ENCRYPTION_KEY is required}
      IDEMPOTENCY_RESPONSE_ENCRYPTION_KEY_ID: ${IDEMPOTENCY_RESPONSE_ENCRYPTION_KEY_ID:-v1}
      BANK_ACCOUNT_ENCRYPTION_KEY: ${BANK_ACCOUNT_ENCRYPTION_KEY}
      TRANSACTION_PIN_REQUIRED: ${TRANSACTION_PIN_REQUIRED:-true}
      INTERNAL_TRANSFERS_ENABLED: ${INTERNAL_TRANSFERS_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health/ready').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - trustpay

  website:
    build:
      context: ./WEBSITE
      dockerfile: Dockerfile
    container_name: trustpay-website
    restart: unless-stopped
    ports:
      # Keep the website origin private to this host as well; terminate TLS at
      # the reverse proxy and proxy only to this loopback binding.
      - '127.0.0.1:3001:3001'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - trustpay

volumes:
  redis_data:

networks:
  trustpay:
    driver: bridge
