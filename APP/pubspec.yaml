name: trustpay_app
description: TRUSTPAY Mobile Application
version: 0.1.5+7

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UI & Routing
  cupertino_icons: ^1.0.6
  go_router: ^14.2.0
  google_fonts: ^6.1.0
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # HTTP Client
  dio: ^5.4.3+1
  uuid: ^4.5.1
  # Secure Storage
  flutter_secure_storage: ^9.2.0
  local_auth: ^3.0.1
  crypto: ^3.0.7
  # Utilities
  intl: ^0.19.0
  logger: ^2.3.0
  url_launcher: ^6.3.2
  share_plus: ^10.1.4
  cross_file: ^0.3.5+2
  file_picker: ^11.0.3
  pdf: ^3.12.0
  image: ^4.8.0
  # Animations
  lottie: ^3.1.2
  supabase_flutter: ^2.12.4
  # Crash reporting (enabled only when SENTRY_DSN dart-define is provided)
  sentry_flutter: ^8.14.2
  flutter_svg: ^2.3.0
  pdfrx: 2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/animations/
    - assets/images/
    - assets/images/feature_cards/
    - assets/images/empty_states/
    - assets/images/vtu/
    - assets/images/kyc/
    - assets/images/ghana_banks/
    - assets/images/nigerian_banks/
    - assets/icons/
