name: trustpay_app
description: TRUSTPAY Mobile Application

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UI & Routing
  cupertino_icons: ^1.0.6
  go_router: ^14.2.0
  google_fonts: ^6.1.0
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # HTTP Client
  dio: ^5.4.3+1
  # Secure Storage
  flutter_secure_storage: ^9.2.0
  # Utilities
  intl: ^0.19.0
  logger: ^2.3.0
  # Animations
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
