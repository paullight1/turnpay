<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRUSTPAY KYC</title>
    <style>
      :root {
        color-scheme: light;
        --red: #ef3f29;
        --red-dark: #9f2118;
        --ink: #111827;
        --muted: #667085;
        --line: #ffd4ce;
        --bg: #f7f8fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      header {
        width: 100%;
        background: var(--red);
        color: white;
        padding: 18px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      main {
        width: min(520px, 100%);
        margin: 0 auto;
        padding: 22px;
      }

      .panel {
        background: white;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px;
        box-shadow: 0 18px 44px rgba(239, 63, 41, 0.12);
      }

      h1 {
        margin: 0;
        font-size: 20px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 26px;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.55;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        padding: 15px 18px;
        background: var(--red);
        color: white;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.55;
        cursor: progress;
      }

      .status {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 12px;
        background: #fff0ed;
        color: var(--red-dark);
        font-size: 14px;
      }
    </style>
    <script src="https://cdn.smileidentity.com/inline/v1/js/script.min.js"></script>
  </head>
  <body>
    <header>
      <h1>TRUSTPAY</h1>
      <span>Smile ID</span>
    </header>
    <main>
      <section class="panel">
        <h2>Verify your identity</h2>
        <p>
          Smile ID will collect your ID and selfie securely. TRUSTPAY receives
          the final verification result from Smile ID on the backend.
        </p>
        <button id="start">Start Smile ID check</button>
        <div class="status" id="status">Preparing secure verification...</div>
      </section>
    </main>
    <script>
      const statusEl = document.querySelector("#status");
      const startButton = document.querySelector("#start");
      const params = new URLSearchParams(window.location.hash.slice(1));
      const token = params.get("token");
      const product = params.get("product") || "biometric_kyc";
      const environment = params.get("environment") || "sandbox";
      const callbackUrl = params.get("callback_url");

      function setStatus(message) {
        statusEl.textContent = message;
      }

      async function startSmile() {
        if (!token || !callbackUrl) {
          setStatus("This verification session is missing its secure token.");
          return;
        }

        if (typeof window.SmileIdentity !== "function") {
          setStatus("Smile ID could not load. Check your connection and retry.");
          return;
        }

        startButton.disabled = true;
        setStatus("Opening Smile ID...");

        try {
          window.SmileIdentity({
            token,
            product,
            environment,
            callback_url: callbackUrl,
            onSuccess: () => {
              setStatus("Verification submitted. You can return to TRUSTPAY.");
            },
            onClose: () => {
              setStatus("Smile ID closed. Return to TRUSTPAY to refresh status.");
              startButton.disabled = false;
            },
            onError: () => {
              setStatus("Smile ID could not complete this session. Try again.");
              startButton.disabled = false;
            },
          });
        } catch (error) {
          setStatus("Smile ID could not start. Try again.");
          startButton.disabled = false;
        }
      }

      startButton.addEventListener("click", startSmile);
      setStatus("Ready. Start when your ID is nearby.");
    </script>
  </body>
</html>
